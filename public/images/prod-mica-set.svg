<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  
  <defs>
    <linearGradient id="bg-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F6" />
      <stop offset="55%" stop-color="#F5E4E8" />
      <stop offset="100%" stop-color="#FDF8F6" />
    </linearGradient>
    <linearGradient id="gold-p3" x1="0%" y1="0%" x2="100%" y2="100%">
