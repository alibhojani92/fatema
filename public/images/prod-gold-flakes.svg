<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  
  <defs>
    <linearGradient id="bg-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F6" />
      <stop offset="55%" stop-color="#F4EBDD" />
      <stop offset="100%" stop-color="#FDF8F6" />
    </linearGradient>
    <linearGradient id="gold-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B3" />
      <stop offset="45%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6A14" />
    </linearGradient>
    <linearGradient id="rose-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7BCC3" />
      <stop offset="50%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#7B3E48" />
    </linearGradient>
    <linearGradient id="glass-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FDF8F6" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="glow-p6" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#23191E" stop-opacity="0.12" />
    </radialGradient>
    <filter id="soft-shadow-p6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#23191E" flood-opacity="0.16" />
    </filter>
    <filter id="marble-tex-p6">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.94 0 0 0  0 0 0.92 0 0  0 0 0 0.08 0" />
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg-p6)" />
  <rect width="900" height="900" filter="url(#marble-tex-p6)" />
  <!-- Soft studio window light arch -->
  <path d="M120,900 L120,250 A330,330 0 0,1 780,250 L780,900 Z" fill="#FFFFFF" opacity="0.34" />
  <!-- Travertine pedestal base -->
  <ellipse cx="450" cy="742" rx="285" ry="44" fill="#23191E" opacity="0.08" />
  <rect x="145" y="705" width="610" height="58" rx="14" fill="#EDE2D5" stroke="#E6D7D0" stroke-width="2" />
  
  <g filter="url(#soft-shadow-p6)">
    <!-- Jar 1: 24K Gold -->
    <g transform="translate(215, 290)">
      <rect x="0" y="55" width="150" height="350" rx="26" fill="#FFFFFF" fill-opacity="0.72" stroke="#E0D2C5" stroke-width="3" />
      <rect x="24" y="0" width="102" height="55" rx="10" fill="#23191E" />
      <g fill="url(#gold-p6)">
        <polygon points="24,130 68,108 82,155 34,172" /><polygon points="75,162 126,144 134,196 84,210" />
        <polygon points="20,215 76,198 92,254 28,266" /><polygon points="64,268 128,248 134,315 72,324" />
        <polygon points="24,312 88,302 98,368 26,374" />
      </g>
    </g>
    <!-- Jar 2: Rose Gold (Center Tall) -->
    <g transform="translate(375, 220)">
      <rect x="0" y="60" width="158" height="420" rx="28" fill="#FFFFFF" fill-opacity="0.75" stroke="#E0D2C5" stroke-width="3" />
      <rect x="28" y="0" width="102" height="60" rx="10" fill="url(#gold-p6)" />
      <g fill="url(#rose-p6)">
        <polygon points="24,135 76,112 92,168 34,185" /><polygon points="78,180 136,162 142,226 84,238" />
        <polygon points="22,238 86,218 100,282 28,295" /><polygon points="66,296 136,274 142,350 72,362" />
        <polygon points="24,352 94,340 108,425 28,432" />
      </g>
    </g>
    <!-- Jar 3: Champagne Silver -->
    <g transform="translate(542, 310)">
      <rect x="0" y="50" width="142" height="330" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="#E0D2C5" stroke-width="3" />
      <rect x="24" y="0" width="94" height="50" rx="10" fill="#23191E" />
      <g fill="#D7D9DE">
        <polygon points="22,120 68,104 82,150 32,164" /><polygon points="68,162 122,148 126,204 74,215" />
        <polygon points="20,218 80,204 94,264 26,274" /><polygon points="58,274 120,260 124,328 66,338" />
      </g>
    </g>
  </g>

</svg>
