<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  
  <defs>
    <linearGradient id="bg-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F6" />
      <stop offset="55%" stop-color="#F2E7E4" />
      <stop offset="100%" stop-color="#FDF8F6" />
    </linearGradient>
    <linearGradient id="gold-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B3" />
      <stop offset="45%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6A14" />
    </linearGradient>
    <linearGradient id="rose-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7BCC3" />
      <stop offset="50%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#7B3E48" />
    </linearGradient>
    <linearGradient id="glass-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FDF8F6" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="glow-p4" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#23191E" stop-opacity="0.12" />
    </radialGradient>
    <filter id="soft-shadow-p4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#23191E" flood-opacity="0.16" />
    </filter>
    <filter id="marble-tex-p4">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.94 0 0 0  0 0 0.92 0 0  0 0 0 0.08 0" />
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg-p4)" />
  <rect width="900" height="900" filter="url(#marble-tex-p4)" />
  <!-- Soft studio window light arch -->
  <path d="M120,900 L120,250 A330,330 0 0,1 780,250 L780,900 Z" fill="#FFFFFF" opacity="0.34" />
  <!-- Travertine pedestal base -->
  <ellipse cx="450" cy="742" rx="285" ry="44" fill="#23191E" opacity="0.08" />
  <rect x="145" y="705" width="610" height="58" rx="14" fill="#ECE0DA" stroke="#E6D7D0" stroke-width="2" />
  
  <g filter="url(#soft-shadow-p4)">
    <!-- Translucent Platinum Silicone Agate Mold -->
    <path d="M180,410 C160,265 280,175 425,195 C565,215 620,335 585,465 C550,590 390,635 275,585 C195,550 192,485 180,410 Z" fill="#FFFFFF" fill-opacity="0.88" stroke="#DECFC9" stroke-width="8" />
    <path d="M218,408 C202,295 298,225 418,240 C526,254 570,348 542,452 C515,550 388,588 296,548 C234,520 228,468 218,408 Z" fill="#F8F1EE" stroke="#E8DCD6" stroke-width="3" />
    <!-- Finished Rose-Gold Geode Coaster Beside Mold -->
    <g transform="translate(155, 165)">
      <path d="M365,370 C355,270 445,205 550,220 C650,235 695,320 668,415 C642,508 525,542 440,504 C382,478 372,425 365,370 Z" fill="#F3D6DB" stroke="url(#gold-p4)" stroke-width="6" />
      <path d="M408,365 C402,300 462,258 536,268 C605,278 636,338 616,404 C598,468 518,492 460,466 C420,448 412,408 408,365 Z" fill="url(#rose-p4)" opacity="0.62" />
      <path d="M388,360 C455,325 535,385 645,320" fill="none" stroke="url(#gold-p4)" stroke-width="4" />
      <ellipse cx="495" cy="315" rx="42" ry="16" fill="#FFFFFF" opacity="0.48" />
    </g>
  </g>

</svg>
